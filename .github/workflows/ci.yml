name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --arch arm64
      - name: Test
        run: scripts/test.sh
      - name: Check translations
        run: scripts/check-strings.sh
